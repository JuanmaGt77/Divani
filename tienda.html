<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tienda · Divani</title>
  <meta name="description" content="Compra ropa americana premium con etiqueta original: vestidos, blusas, jeans, abrigos, bolsas, ropa para niñas, niños y hombre. Pedidos por WhatsApp." />
  <meta property="og:title" content="Tienda · Divani" />
  <meta property="og:description" content="Ropa americana premium con etiqueta original. Compra fácil por WhatsApp." />
  <!-- @include partials/head.html -->
  <script type="module" src="./src/pages/shop.js"></script>
</head>
<body class="page-shop">
  <!-- @include partials/sprite.html -->
  <!-- @include partials/header.html -->

  <main id="contenido" class="shop">
    <section class="container shop-hero">
      <nav class="crumbs" aria-label="Ruta de navegación">
        <a href="index.html">Inicio</a><span aria-hidden="true">/</span>
        <a href="tienda.html">Tienda</a><span aria-hidden="true" data-crumb-sep hidden>/</span>
        <span aria-current="page" data-crumb-current></span>
      </nav>
      <div class="shop-hero__row">
        <div>
          <h1 class="shop-hero__title" data-shop-title>Toda la tienda</h1>
          <div class="shop-hero__meta">
            <p class="shop-hero__desc" data-shop-desc>Ropa americana con etiqueta original para toda la familia.</p>
            <p class="shop-hero__count" data-shop-count aria-live="polite"></p>
          </div>
        </div>
        <div class="segmented segmented--scroll glass pill" role="tablist" aria-label="Departamento" data-dept-filter>
          <span class="segmented__thumb" aria-hidden="true"></span>
          <button class="segmented__btn" role="tab" aria-selected="true" data-dept="">Todo</button>
          <button class="segmented__btn" role="tab" aria-selected="false" data-dept="mujer">Mujer</button>
          <button class="segmented__btn" role="tab" aria-selected="false" data-dept="ninas">Niñas</button>
          <button class="segmented__btn" role="tab" aria-selected="false" data-dept="ninos">Niños</button>
          <button class="segmented__btn" role="tab" aria-selected="false" data-dept="hombre">Hombre</button>
        </div>
      </div>
      <div class="scroller shop-cats-mobile" data-cat-chips-mobile></div>
    </section>

    <div class="shop-bar">
      <div class="container shop-bar__inner">
        <div class="shop-bar__glass glass glass--strong">
          <div class="scroller shop-bar__cats" data-cat-chips></div>
          <div class="shop-bar__actions">
            <button class="btn btn--sm btn--outline filter-btn" type="button" data-open-filters>
              <svg class="icon" aria-hidden="true"><use href="#i-filter"></use></svg>
              Filtros
              <span class="count-badge" data-filter-count></span>
            </button>
            <label class="sort">
              <span class="visually-hidden">Ordenar por</span>
              <select data-sort id="shop-sort">
                <option value="destacados">Destacados</option>
                <option value="nuevo">Lo más nuevo</option>
                <option value="populares">Más pedidos</option>
                <option value="precio-asc">Precio: menor a mayor</option>
                <option value="precio-desc">Precio: mayor a menor</option>
              </select>
              <svg class="icon" aria-hidden="true"><use href="#i-chevron-down"></use></svg>
            </label>
          </div>
        </div>
      </div>
    </div>

    <section class="container shop-body" aria-label="Productos">
      <div class="active-filters" data-active-filters></div>
      <div class="product-grid" data-shop-grid aria-live="polite"></div>
      <div class="shop-more" data-shop-more hidden>
        <p class="small muted" data-shop-progress></p>
        <div class="shop-more__bar" aria-hidden="true"><span data-shop-bar></span></div>
        <button class="btn btn--outline" type="button" data-load-more>Cargar más prendas</button>
      </div>
    </section>
  </main>

  <!-- Filtros -->
  <dialog class="sheet sheet--side" id="sheet-filters" aria-labelledby="filters-title" data-sheet>
    <div class="sheet__panel glass glass--strong">
      <div class="sheet__grabber" data-grabber aria-hidden="true"></div>
      <header class="sheet__head">
        <h2 class="sheet__title" id="filters-title">Filtros</h2>
        <button class="icon-btn glass round" type="button" data-close aria-label="Cerrar filtros">
          <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
        </button>
      </header>
      <form class="filters" data-filters-form></form>
      <footer class="filters__foot">
        <button class="btn btn--outline" type="button" data-filters-clear>Limpiar</button>
        <button class="btn btn--ink" type="button" data-close data-filters-apply>Ver resultados</button>
      </footer>
    </div>
  </dialog>

  <!-- @include partials/footer.html -->
  <!-- @include partials/overlays.html -->
</body>
</html>
